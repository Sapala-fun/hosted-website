name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with Astro
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Preview deployment
        env:
          PR_NUMBER: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_PAGES }}
        run: |
          echo "Build completed. Review the workflow logs to verify the build."
          echo "Deploy would be at: https://Sapala-fun.github.io/hosted-website/pr-${PR_NUMBER}/"
