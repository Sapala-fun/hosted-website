name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with Astro
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Preview deployment
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "Build completed. Review the workflow logs to verify the build."
          echo "Deploy would be at: https://Sapala-fun.github.io/hosted-website/pr-${PR_NUMBER}/"

      - name: Post preview link as comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.number,
              body: '🚀 Preview deployment: https://Sapala-fun.github.io/hosted-website/pr-${{ github.event.number }}/'
            })
