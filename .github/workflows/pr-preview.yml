name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with Astro
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Deploy to PR Preview via Pages API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Building preview for PR #${{ github.event.number }}"
          echo "URL: https://Sapala-fun.github.io/hosted-website/pr-${{ github.event.number }}/"
