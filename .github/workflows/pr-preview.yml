name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set base path
        working-directory: frontend
        run: |
          node -e "const fs = require('fs'); const config = fs.readFileSync('astro.config.mjs', 'utf8'); const updated = config.replace(/base: '\/'/, \`base: '/pr-${{ github.event.number }}/'}\`); fs.writeFileSync('astro.config.mjs', updated);"

      - name: Build with Astro
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Deploy to PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: frontend/dist/
