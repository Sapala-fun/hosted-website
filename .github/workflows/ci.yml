name: CI - Build, Test & Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Go dependencies
        run: |
          cd backend
          go mod download
          go mod tidy

      - name: Run make lint-backend
        run: make lint-backend

      - name: Run make test (short mode)
        run: cd backend && go test -short ./...

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Go binary
        run: |
          mkdir -p bin
          cd backend && go build -o ../bin/ownerrez-proxy .
