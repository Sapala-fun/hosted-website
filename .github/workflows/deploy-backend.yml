# Build and deploy Go backend to Google Cloud Run

name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: cd backend && go mod download

      - name: Build
        run: cd backend && go build -o main .

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ownerrez-proxy \
            --source=backend \
            --platform=managed \
            --region=${{ secrets.GCLOUD_REGION }} \
            --project=${{ secrets.GCLOUD_PROJECT }} \
            --allow-unauthenticated \
            --port=3001 \
            --set-env-vars OWNERREZ_API_BASE_URL=https://api.ownerrez.com,OWNERREZ_PERSONAL_TOKEN=${{ secrets.OWNERREZ_PERSONAL_TOKEN }},OWNERREZ_API_KEY=${{ secrets.OWNERREZ_API_KEY }}
